{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Topic list</h1>
      <a href="{% url 'agency:topic-create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Create
      </a>
  </div>
  {% if topic_list %}
    <div class="row">
      {% for topic in topic_list %}
        <div class="col-md-4 mb-3">
          <div class="card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0">{{ topic.name }}</h5>
              <div>
                <a href="{% url 'agency:topic-update' topic.id %}" class="btn btn-sm btn-outline-primary">
                  Edit
                </a>
                <a href="{% url 'agency:topic-delete' topic.id %}" class="btn btn-sm btn-outline-danger">
                  Delete
                </a>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-info">There are no topics added yet</div>
  {% endif %}
</div>
{% endblock %}
